{% extends "base.html" %}
{% block page_id %}error{% endblock %}
{% block content %}
<section class="errpage">
  <div>
    <div class="code" aria-hidden="true">{{ code }}</div>
    <h1>{{ title }}</h1>
    <p class="muted">{{ message }}</p>
    <div style="display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin-top:1.6rem">
      <a class="btn" href="{{ url_for('public.home') }}" data-reception>Back to reception</a>
      <a class="btn btn--ghost" href="{{ url_for('public.warehouse') }}">The warehouse</a>
    </div>
  </div>
</section>
{% endblock %}
{% block footer %}{% endblock %}
